name: clipforge
x-backend: &backend
  image: clipforge-backend:local
  build:
    context: ./backend
    args:
      LOCAL_WHISPER: ${LOCAL_WHISPER:-0}
      FACE_TRACKING: ${FACE_TRACKING:-0}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://clipforge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/clipforge
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /media-data
    HF_HOME: /media-data/models
  volumes:
    - media:/media-data
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  init: true
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: clipforge
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U clipforge -d clipforge"]
      interval: 4s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - broker:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 4s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    <<: *backend
    command: [sh, -c, "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 15
  worker:
    <<: *backend
    command: [celery, -A, app.worker.queue, worker, --concurrency=1, --loglevel=INFO]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 4g
    cpus: ${WORKER_CPUS:-1.5}
    pids_limit: 160
  beat:
    <<: *backend
    command: [celery, -A, app.worker.queue, beat, --loglevel=INFO, --schedule, /tmp/clipforge-beat]
    depends_on:
      api: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]
    restart: unless-stopped

volumes:
  media:
  postgres:
  broker:
